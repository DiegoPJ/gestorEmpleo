<section class="page-header">

    <h1>Seguimiento de busqueda</h1>

<section class="metrics" aria-label="Resumen">
  @for (metric of metrics; track metric.label) {
    <article>
      <span>{{ metric.label }}</span>
      <strong>{{ metric.value }}</strong>
    </article>
  }
</section>
